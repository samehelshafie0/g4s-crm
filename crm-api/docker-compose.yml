version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: g4s_crm_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: g4s_crm
      POSTGRES_USER: g4s_app
      POSTGRES_PASSWORD: devpassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U g4s_app -d g4s_crm"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: g4s_crm_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: g4s_crm_api
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: development
      APP_PORT: "8080"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: g4s_crm
      DB_USER: g4s_app
      DB_PASSWORD: devpassword
      DB_SSLMODE: disable
      REDIS_ADDR: redis:6379
      JWT_PRIVATE_KEY_PATH: /app/keys/private.pem
      JWT_PUBLIC_KEY_PATH: /app/keys/public.pem
      JWT_REFRESH_SECRET: dev-refresh-secret-change-in-prod
      STORAGE_ROOT: /app/storage
      LOG_LEVEL: debug
    volumes:
      - ./keys:/app/keys:ro
      - api_storage:/app/storage

volumes:
  postgres_data:
  redis_data:
  api_storage:
