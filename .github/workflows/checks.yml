name: CRM checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crm-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: crm-dashboard/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: crm_test
          POSTGRES_USER: crm_test
          POSTGRES_PASSWORD: crm_test_local
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U crm_test -d crm_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CRM_TEST_DATABASE_URL: postgres://crm_test:crm_test_local@127.0.0.1:5432/crm_test?sslmode=disable
    defaults:
      run:
        working-directory: crm-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: crm-api/go.mod
          cache-dependency-path: crm-api/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libreoffice-writer libreoffice-calc fonts-dejavu-core
      - run: pip install -r pdf-test-requirements.txt
      - run: echo "PDF_PYTHON=$(which python)" >> "$GITHUB_ENV"
      - run: python ../scripts/test_quote_pdf.py
      - run: go test -race ./...
      - run: go vet ./...
