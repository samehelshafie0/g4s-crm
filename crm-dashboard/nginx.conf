server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        text/xml
        application/xml
        application/xml+rss
        image/svg+xml;
    gzip_min_length 1024;

    # Security headers (repeated in each location that sets its own headers)
    include /etc/nginx/snippets/security-headers.inc;

    # Health check endpoint (for Docker HEALTHCHECK)
    location = /health {
        access_log off;
        return 200 "ok\n";
        include /etc/nginx/snippets/security-headers.inc;
        add_header Content-Type text/plain;
    }

    # ─── API Proxy ────────────────────────────────────────────
    # Forward all /api/* requests to the Go backend
    location /api/ {
        # Match the API's MAX_UPLOAD_SIZE (50 MB) so document uploads are not
        # rejected by nginx's 1 MB default before they reach the Go service.
        client_max_body_size 50m;

        proxy_pass         http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Quote PDF export can take up to 3 minutes (services/quote_pdf.go).
        proxy_read_timeout  190s;
        proxy_send_timeout  190s;
        proxy_connect_timeout 10s;

        # Don't buffer API responses
        proxy_buffering off;
    }

    # ─── Static Assets ────────────────────────────────────────
    # Cache hashed assets (Vite adds hashes to filenames)
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        include /etc/nginx/snippets/security-headers.inc;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ─── Vue SPA Fallback ─────────────────────────────────────
    # All other routes go to index.html (Vue Router handles them)
    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/snippets/security-headers.inc;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
