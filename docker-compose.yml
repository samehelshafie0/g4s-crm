version: "3.9"

# ─────────────────────────────────────────────────────────────
#  G4S CRM — Full Stack
#  Services: frontend (Nginx+Vue) · api (Go) · postgres · redis
# ─────────────────────────────────────────────────────────────

services:

  # ─── PostgreSQL 16 ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: g4s_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: g4s_crm
      POSTGRES_USER: g4s_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devpassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - g4s_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U g4s_app -d g4s_crm"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─── Redis 7 ───────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: g4s_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - g4s_internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Go API ────────────────────────────────────────────────
  api:
    build:
      context: ./crm-api
      dockerfile: Dockerfile
    container_name: g4s_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_PORT: "8080"
      APP_HOST: "0.0.0.0"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: g4s_crm
      DB_USER: g4s_app
      DB_PASSWORD: ${DB_PASSWORD:-devpassword}
      DB_SSLMODE: disable
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ""
      JWT_PRIVATE_KEY_PATH: /app/keys/private.pem
      JWT_PUBLIC_KEY_PATH: /app/keys/public.pem
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-in-production}
      JWT_ACCESS_EXPIRY: ${JWT_ACCESS_EXPIRY:-15m}
      JWT_REFRESH_EXPIRY: ${JWT_REFRESH_EXPIRY:-168h}
      STORAGE_ROOT: /app/storage
      MAX_UPLOAD_SIZE: "52428800"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ./crm-api/keys:/app/keys:ro          # Mount RSA key pair (read-only)
      - api_storage:/app/storage              # Persistent file uploads
    networks:
      - g4s_internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ─── Vue 3 Frontend (Nginx) ────────────────────────────────
  frontend:
    build:
      context: ./crm-dashboard
      dockerfile: Dockerfile
    container_name: g4s_frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"             # Expose to host
    networks:
      - g4s_internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

# ─── Networks ────────────────────────────────────────────────
networks:
  g4s_internal:
    driver: bridge

# ─── Volumes ─────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  api_storage:
    driver: local
